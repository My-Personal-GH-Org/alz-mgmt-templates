---
name: Continuous Delivery
on:
  workflow_call:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        default: 'apply'
        type: string
      root_module_folder_relative_path:
        description: 'Root Module Folder Relative Path'
        default: '.'
        type: string
      terraform_cli_version:
        description: 'Terraform CLI Version'
        default: 'latest'
        type: string
      terraform_target:
        description: 'Optional -target=... flags (space separated)'
        default: ''
        type: string
      import_resources:
        description: 'One-time state reconciliation: adds -refresh=false so the plan only evaluates the resources named in terraform_target plus any configured import {} blocks, avoiding unrelated broken resources elsewhere in state'
        default: false
        type: boolean
      root_management_group_id:
        description: 'If set, after apply checks whether the plan touched a policy_assignment/policy_role_assignment at this MG id and auto-runs Scripts/Invoke-PolicyRemediationSweep.ps1 -TargetScope RootOnly against it - works around the known terraform-provider-alz limitation that it never auto-creates role assignments at an externally-referenced (non-Terraform-owned) root MG. Leave blank to disable.'
        default: ''
        type: string

jobs:
  plan:
    name: Plan with Terraform
    runs-on:
      self-hosted
    concurrency: mgmt-tfstate
    environment: alz-mgmt-plan
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ vars.AZURE_CLIENT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ vars.AZURE_TENANT_ID }}"
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      - name: Terraform Init
        run: |
          terraform \
          -chdir="${{inputs.root_module_folder_relative_path}}" \
          init \
          -backend-config="resource_group_name=${{vars.BACKEND_AZURE_RESOURCE_GROUP_NAME}}" \
          -backend-config="storage_account_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME}}" \
          -backend-config="container_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME}}" \
          -backend-config="key=terraform.tfstate"

      - name: Terraform Plan for ${{ inputs.terraform_action == 'destroy' && 'Destroy' || 'Apply' }}
        run: |
          # shellcheck disable=SC2086
          terraform \
          -chdir="${{inputs.root_module_folder_relative_path}}" \
          plan \
          -out=tfplan \
          -input=false \
          ${{ inputs.terraform_action == 'destroy' && '-destroy' || '' }} \
          ${{ inputs.import_resources && '-refresh=false' || '' }} \
          ${{ inputs.terraform_target }}

      - name: Create Module Artifact
        run: |
          $stagingDirectory = "staging"
          $rootModuleFolder = "${{inputs.root_module_folder_relative_path}}"
          New-Item -Path . -Name $stagingDirectory -ItemType "directory"
          Copy-Item -Path "./*" -Exclude @(".git", ".terraform", ".github",  $stagingDirectory) -Recurse -Destination "./$stagingDirectory"

          $rootModuleFolderTerraformFolder = Join-Path -Path "./$stagingDirectory" -ChildPath $rootModuleFolder -AdditionalChildPath ".terraform"
          if(Test-Path -Path $rootModuleFolderTerraformFolder) {
            Remove-Item -Path $rootModuleFolderTerraformFolder -Recurse -Force
          }

        shell: pwsh

      - name: Publish Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: ./staging/

      - name: Show the Plan for Review
        run: |
          terraform \
          -chdir="${{inputs.root_module_folder_relative_path}}" \
          show \
          tfplan

  apply:
    needs: plan
    name: Apply with Terraform
    runs-on:
      self-hosted
    concurrency: mgmt-tfstate
    environment: alz-mgmt-apply
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ vars.AZURE_CLIENT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ vars.AZURE_TENANT_ID }}"
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: "60m" # Accounts for eventually consistent management group permissions propagation
      TF_CLI_ARGS_apply: "-parallelism=3" # Self-hosted runner OOMs (exit 137) at default parallelism=10, even on smaller plans

    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: module

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      - name: Terraform Init
        run: |
          terraform \
          -chdir="${{inputs.root_module_folder_relative_path}}" \
          init \
          -backend-config="resource_group_name=${{vars.BACKEND_AZURE_RESOURCE_GROUP_NAME}}" \
          -backend-config="storage_account_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME}}" \
          -backend-config="container_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME}}" \
          -backend-config="key=terraform.tfstate"

      - name: Terraform ${{ inputs.terraform_action == 'destroy' && 'Destroy' || 'Apply' }}
        run: |
          terraform \
          -chdir="${{inputs.root_module_folder_relative_path}}" \
          apply \
          -input=false \
          -auto-approve \
          tfplan

      - name: Detect Root-Scoped Policy/Role-Assignment Changes
        id: detect_root_policy_change
        if: inputs.root_management_group_id != ''
        shell: pwsh
        run: |
          terraform -chdir="${{inputs.root_module_folder_relative_path}}" show -json tfplan > plan.json
          $plan = Get-Content plan.json -Raw | ConvertFrom-Json
          $rootMg = "${{ inputs.root_management_group_id }}"
          # Match on the resource's real parent_id, not the address string - policy_role_assignments
          # keys are uuidv5() hashes with no MG name in them, so an address substring match (the
          # original approach here) can never detect a root-scoped role-assignment change, which is
          # exactly the resource type this whole mechanism exists to catch. Checked against both
          # after (create/update) and before (destroy) since either can be null depending on the action.
          $rootMgSuffix = "/managementGroups/$rootMg"
          $matched = $plan.resource_changes | Where-Object {
            $_.address -match 'azapi_resource\.(policy_assignments|policy_role_assignments)\[' -and (
              ($_.change.after.parent_id -and $_.change.after.parent_id -like "*$rootMgSuffix") -or
              ($_.change.before.parent_id -and $_.change.before.parent_id -like "*$rootMgSuffix")
            )
          }
          $changed = $matched.Count -gt 0
          "root_changed=$($changed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($changed) {
            Write-Host "Root-scoped policy_assignment/policy_role_assignment change(s) detected:"
            $matched | ForEach-Object { Write-Host "  - $($_.address)" }
          } else {
            Write-Host "No root-scoped policy_assignment/policy_role_assignment changes in this apply."
          }

      - name: Azure Login for PolicySweep
        if: inputs.root_management_group_id != '' && steps.detect_root_policy_change.outputs.root_changed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Run PolicySweep (Root-Only)
        if: inputs.root_management_group_id != '' && steps.detect_root_policy_change.outputs.root_changed == 'true'
        shell: pwsh
        run: |
          ./Scripts/Invoke-PolicyRemediationSweep.ps1 -RootManagementGroupId "${{ inputs.root_management_group_id }}" -TargetScope RootOnly
